<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>สั่งซื้อสินค้า | Body Scent</title>
  <link rel="stylesheet" href="style.css">

  <style>
    /* สไตล์เฉพาะหน้าสั่งซื้อ */
    .order-wrap {
      max-width: 620px;
      margin: 0 auto;
      padding: var(--space-xl) var(--space-lg);
      background: var(--color-white);
      border: 1px solid var(--color-line);
    }

    .order-wrap .section-head {
      margin-bottom: var(--space-lg);
    }

    .form-hint {
      margin-top: var(--space-xs);
      font-size: 0.8rem;
      color: var(--color-text-mute);
    }

    .required {
      color: var(--color-accent-dark);
    }

    .order-actions {
      margin-top: var(--space-lg);
      text-align: center;
    }

    @media (max-width: 768px) {
      .order-wrap {
        padding: var(--space-lg) var(--space-md);
      }
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a href="index.html" class="logo">Body Scent</a>
      <nav class="nav">
        <a href="index.html">หน้าแรก</a>
        <a href="product.html">สินค้า</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container">
        <div class="order-wrap">

          <div class="section-head">
            <span class="eyebrow">Order</span>
            <h1>สั่งซื้อสินค้า</h1>
            <hr class="divider">
            <p>กรอกข้อมูลด้านล่าง เราจะติดต่อกลับเพื่อยืนยันคำสั่งซื้อ</p>
          </div>

          <form id="orderForm">
            <div class="form-group">
              <label for="customerName">ชื่อลูกค้า <span class="required">*</span></label>
              <input type="text" id="customerName" name="customerName" placeholder="ชื่อ-นามสกุล" autocomplete="name" required>
            </div>

            <div class="form-group">
              <label for="contact">เบอร์โทร / Line <span class="required">*</span></label>
              <input type="text" id="contact" name="contact" placeholder="เบอร์โทรศัพท์ หรือ Line ID" autocomplete="tel" required>
            </div>

            <div class="form-group">
              <label for="items">รายการสินค้า <span class="required">*</span></label>
              <textarea id="items" name="items" rows="3" placeholder="ชื่อสินค้าและจำนวน" required></textarea>
              <p class="form-hint">หากต้องการสั่งหลายรายการ สามารถพิมพ์เพิ่มได้ในช่องนี้</p>
            </div>

            <div class="form-group">
              <label for="total">จำนวนเงินรวม (บาท) <span class="required">*</span></label>
              <input type="number" id="total" name="total" min="0" step="any" placeholder="0" required>
            </div>

            <div class="form-group">
              <label for="note">หมายเหตุ</label>
              <textarea id="note" name="note" rows="3" placeholder="ที่อยู่จัดส่งหรือข้อความเพิ่มเติม (ถ้ามี)"></textarea>
            </div>

            <div class="order-actions">
              <button type="submit" class="btn btn--solid">ยืนยันสั่งซื้อ</button>
            </div>
          </form>

        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <a href="index.html" class="logo">Body Scent</a>
      <p>เติมความหอมที่ใช่ให้ตรงกับทุกอารมณ์ในแต่ละวัน</p>
      <p>&copy; 2026 Body Scent. All rights reserved.</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
